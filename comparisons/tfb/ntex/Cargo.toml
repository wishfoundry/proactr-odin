[package]
name = "ntex-tfb"
version = "0.1.0"
edition = "2021"

[dependencies]
ntex = { version = "2", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
once_cell = "1"
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
