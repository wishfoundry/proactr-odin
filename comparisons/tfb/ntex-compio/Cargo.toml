[package]
name = "ntex-compio-tfb"
version = "0.1.0"
edition = "2021"

# ntex on the compio runtime (io_uring driver on Linux).
[dependencies]
ntex = { version = "2", default-features = false, features = ["compio"] }
rusqlite = { version = "0.32", features = ["bundled"] }
once_cell = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
